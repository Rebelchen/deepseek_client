[project]
name = "deepseek-client"
version = "1.4.0"
description = "DeepSeek 本地桌面问答客户端：流式输出、深度思考、Function Calling、KaTeX 公式渲染"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Rebelchen"},
]
keywords = ["deepseek", "chatbot", "desktop", "pywebview", "katex", "llm", "flask"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "openai>=1.0.0",
    "markdown>=3.0",
    "pygments>=2.0",
    "pywebview>=6.0",
    "flask>=3.0",
]

[project.scripts]
deepseek-client = "main:main"

[project.urls]
Homepage = "https://github.com/Rebelchen/deepseek_client"
Documentation = "https://github.com/Rebelchen/deepseek_client/blob/main/README.md"
Source = "https://github.com/Rebelchen/deepseek_client"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "ui*"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt"]
